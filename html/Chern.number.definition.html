<h2>Chern number: definition</h2>

<hr>

<p>
A Chern number is a topological invariant, generically defined as the sum
over all bands of the integral of each band's <a href="Berry.curvature.as.magnetic.field.html">Berry curvature as a magnetic field</a> over the entire BZ.
</p>
