<h2>Definition: unconventional superconductivity</h2>

<hr>

<p>
A SC is unconventional if the following equality <b>does not hold</b>:
\[
\Delta_{Rk} = \Delta_{k} \tag{1}
\]
where $Rk$ is the k-vector $(k_x, k_y, k_z)$ transformed under $R$,
$R$ is any symmetry of the point group of the crystal.
</p>
